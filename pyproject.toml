[project]
name = "i-am-an-engineer"
version = "0.1.0"
description = "Agent toolkit: one recording session of a founder into professional English ad videos performed by their own digital twin (face + cloned voice), then cut like a real ad."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "httpx>=0.27",
  "faster-whisper>=1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
iae = "i_am_an_engineer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["i_am_an_engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
